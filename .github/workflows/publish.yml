jobs:
  pypi-publish:
    name: upload release to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Create dist
        run: |
          pwd
          ls -l .
          python setup.py sdist
          ls -l .
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
